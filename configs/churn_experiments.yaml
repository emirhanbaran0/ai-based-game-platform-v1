experiment_name: "Churn_Prediction_Experiments"

processed_data_path: "data/processed/churn_predictor/filtered_final_ml_excel_churn_predictor_for_ml.csv"
target_column: "is_quit"

models:
  - model_name: "RandomForestClassifier"
    param_grid:
      - n_estimators: 100
        max_depth: 10
        random_state: 42
        class_weight: "balanced"
      - n_estimators: 200
        max_depth: 20
        random_state: 42
        class_weight: "balanced"
      - n_estimators: 150
        max_depth: null
        max_features: "sqrt"
        random_state: 42
        class_weight: "balanced"
      - n_estimators: 300
        max_depth: 30
        max_features: "log2"
        random_state: 42
        class_weight: "balanced"

  - model_name: "XGBClassifier"
    param_grid:
      - n_estimators: 100
        learning_rate: 0.1
        subsample: 0.8
        scale_pos_weight: 0.4
        random_state: 42
      - n_estimators: 150
        learning_rate: 0.05
        subsample: 0.7
        scale_pos_weight: 0.4
        random_state: 42
      - n_estimators: 200
        learning_rate: 0.01
        subsample: 0.9
        max_depth: 6
        colsample_bytree: 0.8
        scale_pos_weight: 0.4
        random_state: 42
      - n_estimators: 250
        learning_rate: 0.2
        subsample: 0.6
        max_depth: 4
        colsample_bytree: 0.6
        scale_pos_weight: 0.4
        random_state: 42

  - model_name: "LogisticRegression"
    param_grid:
      - C: 1.0
        solver: "liblinear"
        random_state: 42
        class_weight: "balanced"
      - C: 0.5
        solver: "liblinear"
        random_state: 42
        class_weight: "balanced"
      - C: 0.1
        solver: "liblinear"
        penalty: "l1"
        random_state: 42
        class_weight: "balanced"
      - C: 10.0
        solver: "lbfgs"
        penalty: "l2"
        max_iter: 500
        random_state: 42
        class_weight: "balanced"
