experiment_name: "Personalized_Ad_Frequency_Clustering_Experiments"

processed_data_path: "data/processed/personalized_ad_frequency_model/filtered_final_ml_excel_personalized_ad_frequency_model.xlsx"

models:
  - model_name: "DBSCANClusterer"
    param_grid:
      - eps: 0.3
        min_samples: 200
        metric: "euclidean"
        algorithm: "auto"
      - eps: 0.4
        min_samples: 200
        metric: "manhattan"
        algorithm: "auto"
      - eps: 0.4
        min_samples: 200
        metric: "cosine"
        algorithm: "brute"
      - eps: 0.5
        min_samples: 200
        metric: "manhattan"
        algorithm: "auto"
      - eps: 0.6
        min_samples: 300
        metric: "euclidean"
        algorithm: "auto"
      - eps: 0.6
        min_samples: 400
        metric: "manhattan"
        algorithm: "auto"
      - eps: 0.7
        min_samples: 500
        metric: "cosine"
        algorithm: "brute"
      - eps: 0.8
        min_samples: 300
        metric: "euclidean"
        algorithm: "auto"
      - eps: 0.9
        min_samples: 400
        metric: "manhattan"
        algorithm: "auto"
      - eps: 1.0
        min_samples: 300
        metric: "cosine"
        algorithm: "brute"
      - eps: 1.1
        min_samples: 500
        metric: "euclidean"
        algorithm: "auto"
      - eps: 1.2
        min_samples: 500
        metric: "manhattan"
        algorithm: "auto"

  - model_name: "KMeansClusterer"
    param_grid:
      - n_clusters: 3
        init: "k-means++"
        n_init: 10
        max_iter: 300

  - model_name: "AgglomerativeClusterer"
    param_grid:
      - n_clusters: 3
        metric: "euclidean"
        linkage: "ward"

  - model_name: "MeanShiftClusterer"
    param_grid:
      - bandwidth: 2
        bin_seeding: True

  - model_name: "GaussianMixtureClusterer"
    param_grid:
      - n_components: 3
        covariance_type: "full"
        max_iter: 100
