experiment_name: "Personalized_Level_Difficulty_Clustering_Experiments"

processed_data_path: "data/processed/personalized_difficulty_model/filtered_final_ml_excel_personalized_difficulty_model_for_ml.xlsx"

models:     
  - model_name: "KMeansClusterer"
    param_grid:
      - n_clusters: 2
        init: "k-means++"
        n_init: 10
        max_iter: 300
        tol: 0.0001
        algorithm: lloyd
      - n_clusters: 3
        init: "k-means++"
        n_init: 10
        max_iter: 300
        tol: 0.0001
        algorithm: lloyd
      - n_clusters: 4
        init: "k-means++"
        n_init: 10
        max_iter: 300
        tol: 0.0001
        algorithm: lloyd
      - n_clusters: 3
        init: "random"
        n_init: 20
        max_iter: 500
        tol: 0.001
        algorithm: elkan
      - n_clusters: 7
        init: "k-means++"
        n_init: 20
        max_iter: 1000
        tol: 0.001
        algorithm: elkan
      - n_clusters: 6
        init: "random"
        n_init: 10
        max_iter: 300
        tol: 0.0001
        algorithm: lloyd
  - model_name: "SpectralClusterer"
    param_grid:
      - n_clusters : 7
        affinity : "nearest_neighbors"
        assign_labels : "kmeans"
        random_state : 42



